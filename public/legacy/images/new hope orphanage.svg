<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Orange neon glow -->
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- NEW HOPE -->
  <text x="210" y="45" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="2" fill="#FF8C00" filter="url(#orangeGlow)">
    NEW HOPE
  </text>

  <!-- Futuristic divider -->
  <line x1="110" y1="55" x2="310" y2="55" stroke="#FF8C00" stroke-width="2" opacity="0.75" filter="url(#orangeGlow)"></line>

  <!-- ORPHANAGE -->
  <text x="210" y="80" text-anchor="middle" font-family="Orbitron, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#FFD180" filter="url(#orangeGlow)">
    ORPHANAGE
  </text>
</svg>
